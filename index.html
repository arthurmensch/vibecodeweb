<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demographics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Demographics Dashboard</h1>
  <p id="subtitle"></p>
</header>

<main>
  <section id="kpi-row">
    <div class="kpi" id="kpi-total"><span class="kpi-value"></span><span class="kpi-label">Headcount</span></div>
    <div class="kpi" id="kpi-male"><span class="kpi-value"></span><span class="kpi-label">Male</span></div>
    <div class="kpi" id="kpi-female"><span class="kpi-value"></span><span class="kpi-label">Female</span></div>
    <div class="kpi" id="kpi-undisclosed"><span class="kpi-value"></span><span class="kpi-label">Undisclosed</span></div>
    <div class="kpi" id="kpi-mean"><span class="kpi-value"></span><span class="kpi-label">Mean age</span></div>
    <div class="kpi" id="kpi-median"><span class="kpi-value"></span><span class="kpi-label">Median age</span></div>
  </section>

  <section class="grid">
    <div class="card" id="card-age">
      <h2>Age distribution</h2>
      <canvas id="chart-age" aria-label="Age distribution histogram" role="img"></canvas>
    </div>

    <div class="card" id="card-gender">
      <h2>Gender split</h2>
      <canvas id="chart-gender" aria-label="Overall gender split donut" role="img"></canvas>
    </div>

    <div class="card wide">
      <h2>Gender split by department group</h2>
      <canvas id="chart-gender-dept" aria-label="Gender split per department group" role="img"></canvas>
    </div>
  </section>

  <section>
    <h2>Department groups</h2>
    <div id="group-cards"></div>
    <p class="hint">Click a group to filter the charts. Click again to clear.</p>
  </section>
</main>

<footer>
  <p>Source: <a id="source-link" target="_blank" rel="noopener">Mistralers Demographics Data</a> &middot; data as of <span id="asof"></span></p>
</footer>

<script src="app.js"></script>
</body>
</html>
